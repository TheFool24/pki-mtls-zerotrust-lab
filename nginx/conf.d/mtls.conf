# Thesis Lab — Nginx mTLS Reverse Proxy
# Terminates mutual TLS, enforces client certificate verification
# Forwards authenticated requests to upstream FastAPI controller (Step 7)

# Upstream FastAPI controller (added in Step 7)
# upstream controller_backend {
#     server controller:8000;
#     keepalive 32;
# }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name controller.thesis.local 10.50.20.200 master-lab;

    # ── Server identity (TLS termination) ──
    # server.crt is leaf + intermediate chain (step CLI emits both)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ── TLS protocol settings (per thesis ИС-4) ──
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Client certificate verification (the mTLS part) ──
    # ca-trust.crt = Root + Intermediate; either can sign trusted client certs.
    ssl_client_certificate /etc/nginx/certs/ca-trust.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    access_log /var/log/nginx/mtls-access.log;
    error_log  /var/log/nginx/mtls-error.log info;

    # ── Health endpoint (any verified client) ──
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","mtls":"verified","client_cn":"$ssl_client_s_dn"}\n';
    }

    # ── Placeholder until FastAPI is deployed (Step 7) ──
    location / {
        default_type application/json;
        return 200 '{"message":"mTLS handshake successful","client_subject":"$ssl_client_s_dn","verified":"$ssl_client_verify"}\n';
    }

    # ── Step 7 will replace location / with proxy_pass and the headers below: ──
    # location / {
    #     proxy_pass http://controller_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Client-Verify $ssl_client_verify;
    #     proxy_set_header X-Client-DN $ssl_client_s_dn;
    #     proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    # }
}

# HTTP → HTTPS redirect (defense in depth)
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Localhost-only HTTP listener for container healthcheck.
# Avoids needing wget --certificate (busybox wget can't do client certs).
server {
    listen 127.0.0.1:8080;
    server_name _;
    location = /nginx-alive {
        access_log off;
        return 200 "ok\n";
    }
}
