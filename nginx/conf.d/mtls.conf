# Thesis Lab — Nginx mTLS Reverse Proxy
# Terminates mutual TLS, enforces client certificate verification
# Forwards authenticated requests to FastAPI controller backend

upstream controller_backend {
    server controller:8000;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name controller.thesis.local 10.50.20.200 master-lab;

    # ── Server identity (TLS termination) ──
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ── TLS protocol settings (per thesis ИС-4) ──
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Client certificate verification (the mTLS part) ──
    # ca-trust.crt = Root + Intermediate (Step 6 naming; plan said ca-root.crt
    # which does not exist in this deployment).
    ssl_client_certificate /etc/nginx/certs/ca-trust.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ── Logging ──
    access_log /var/log/nginx/mtls-access.log;
    error_log  /var/log/nginx/mtls-error.log info;

    # ── Health endpoint (open to anyone with valid cert) ──
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","mtls":"verified","client_cn":"$ssl_client_s_dn"}\n';
    }

    # ── All API traffic → FastAPI controller backend ──
    location /api/ {
        proxy_pass http://controller_backend;
        proxy_http_version 1.1;

        # Standard forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # mTLS identity headers — consumed by app.core.security
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;

        # Connection upgrade (for future WebSocket support, harmless otherwise)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── OpenAPI docs (only available behind mTLS) ──
    location /docs {
        proxy_pass http://controller_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
    }

    location /openapi.json {
        proxy_pass http://controller_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
    }

    # ── Default: reject ──
    location / {
        default_type application/json;
        return 404 '{"detail":"endpoint not found"}\n';
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Localhost-only HTTP listener for container healthcheck.
server {
    listen 127.0.0.1:8080;
    server_name _;
    location = /nginx-alive {
        access_log off;
        return 200 "ok\n";
    }
}
