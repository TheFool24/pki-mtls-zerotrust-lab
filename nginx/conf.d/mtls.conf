# Thesis Lab — Nginx mTLS Reverse Proxy
# Terminates mutual TLS, enforces client certificate verification
# Forwards authenticated requests to FastAPI controller backend

# ── JSON access log format ──
# Emits structured JSON on stdout for Promtail/Loki ingestion.
# Captures per-handshake security evidence: TLS version, cipher, client DN,
# verification outcome, response code, upstream timing.
log_format mtls_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"remote_port":"$remote_port",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"protocol":"$server_protocol",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"request_length":$request_length,'
    '"request_time":$request_time,'
    '"ssl_protocol":"$ssl_protocol",'
    '"ssl_cipher":"$ssl_cipher",'
    '"ssl_client_verify":"$ssl_client_verify",'
    '"ssl_client_s_dn":"$ssl_client_s_dn",'
    '"ssl_session_reused":"$ssl_session_reused",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"http_user_agent":"$http_user_agent",'
    '"event":"nginx_access"'
'}';

# NOTE: No static `upstream {}` block / `server name:port` directive here.
# nginx resolves those ONCE at startup and hard-fails ("host not found in
# upstream") if the backend isn't resolvable yet — which happens on host reboot,
# because `restart: unless-stopped` does NOT honor compose depends_on, so nginx
# can start before controller/grafana register in Docker DNS. Instead we use a
# `resolver` + variable proxy_pass so upstreams resolve at REQUEST time: nginx
# starts cleanly regardless of boot order and returns 502 (not a crash loop) if
# a backend is momentarily down.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name controller.thesis.local 10.50.20.200 master-lab;

    # Docker embedded DNS — resolve upstream names at request time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_controller controller:8000;
    set $upstream_grafana grafana:3000;

    # ── Server identity (TLS termination) ──
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # ── TLS protocol settings (per thesis ИС-4) ──
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Client certificate verification (mTLS) ──
    ssl_client_certificate /etc/nginx/certs/ca-trust.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ── Logging — JSON to stdout for Loki ingestion ──
    access_log /dev/stdout mtls_json;
    error_log  /dev/stderr info;

    # ── Health endpoint (open to anyone with valid cert) ──
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","mtls":"verified","client_cn":"$ssl_client_s_dn"}\n';
    }

    # ── All API traffic → FastAPI controller backend ──
    location /api/ {
        proxy_pass http://$upstream_controller;
        proxy_http_version 1.1;

        # Standard forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # mTLS identity headers — consumed by app.core.security
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;

        # Connection upgrade (for future WebSocket support, harmless otherwise)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── OpenAPI docs (only available behind mTLS) ──
    location /docs {
        proxy_pass http://$upstream_controller;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
    }

    location /openapi.json {
        proxy_pass http://$upstream_controller;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-DN $ssl_client_s_dn;
    }

    # ── Grafana (9C-i) — proxied behind same mTLS gate ──
    # NO trailing slash / URI on proxy_pass: Grafana runs with
    # serve_from_sub_path=true and expects the /grafana/ prefix. A trailing
    # slash would strip the prefix, causing an infinite 301 redirect loop.
    location /grafana/ {
        proxy_pass http://$upstream_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Grafana needs these for WebSocket (live dashboards)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward mTLS identity to Grafana for future auth integration
        proxy_set_header X-Client-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Verify $ssl_client_verify;

        # Grafana sets various long-lived connections
        proxy_read_timeout 300s;
    }

    # Grafana live (WebSocket for real-time updates)
    location /grafana/api/live/ {
        proxy_pass http://$upstream_grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── Default: reject ──
    location / {
        default_type application/json;
        return 404 '{"detail":"endpoint not found"}\n';
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name _;
    access_log /dev/stdout mtls_json;
    return 301 https://$host$request_uri;
}

# Localhost-only HTTP listener for container healthcheck.
server {
    listen 127.0.0.1:8080;
    server_name _;
    location = /nginx-alive {
        access_log off;
        return 200 "ok\n";
    }
}
