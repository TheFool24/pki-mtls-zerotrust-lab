# Thesis Lab — Master Controller Services
# Architecture: PKI + mTLS + Zero Trust laboratory environment
# Author: jojo (ВУТП, 2026)

services:
  step-ca:
    image: smallstep/step-ca:0.28.1
    container_name: thesis-step-ca
    hostname: ca.thesis.local
    restart: unless-stopped
    ports:
      - "10.50.20.200:9000:9000"
    volumes:
      - step-ca-data:/home/step
      - ./step-ca/secrets:/secrets:ro
      # Image entrypoint reads the CA password from /home/step/secrets/password.
      # Bind-mount our host file to that exact path (overlays the named volume).
      # Keeping the password OUTSIDE the volume — same volume holding the
      # encrypted keys must not hold the decryption password.
      - ./step-ca/secrets/ca-password.txt:/home/step/secrets/password:ro
    networks:
      thesis-net:
        ipv4_address: 172.28.0.10
        aliases:
          - ca.thesis.local
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost:9000/health 2>/dev/null | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "thesis.role=pki-ca"
      - "thesis.tier=infrastructure"

  controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    image: thesis-controller:0.1.0
    container_name: thesis-controller
    hostname: controller.thesis.local
    restart: unless-stopped
    # No host port exposure — only reachable through Nginx (defense in depth)
    expose:
      - "8000"
    volumes:
      - controller-data:/app/data
      # CA trust bundle — lets the controller verify step-ca's TLS when fetching
      # the CRL for certificate-revocation checking.
      - ./nginx/certs/ca-trust.crt:/etc/thesis-certs/ca-trust.crt:ro
    networks:
      thesis-net:
        ipv4_address: 172.28.0.30
        aliases:
          - controller.thesis.local
    environment:
      THESIS_SERVICE_NAME: "thesis-controller"
      THESIS_SERVICE_VERSION: "0.1.0"
      THESIS_ENVIRONMENT: "lab"
      # 4 slashes = absolute path /app/data/thesis.db (3 would be relative
      # to WORKDIR and resolve to /app/app/data/thesis.db — wrong).
      THESIS_DATABASE_URL: "sqlite+aiosqlite:////app/data/thesis.db"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "thesis.role=api-controller"
      - "thesis.tier=application"

  nginx:
    image: nginx:1.27-alpine
    container_name: thesis-nginx
    hostname: nginx.thesis.local
    restart: unless-stopped
    ports:
      - "10.50.20.200:443:443"
      - "10.50.20.200:80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # nginx-logs volume removed in 9C-i — access logs now JSON to stdout
      # (captured by Promtail), no longer file-based.
    networks:
      thesis-net:
        ipv4_address: 172.28.0.20
        aliases:
          - nginx.thesis.local
    depends_on:
      step-ca:
        condition: service_healthy
      controller:
        condition: service_healthy
    healthcheck:
      # `nginx -t` validates config + cert file accessibility. Busybox wget
      # can't do client certs, and plain HTTPS hits ssl_verify_client.
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "thesis.role=mtls-proxy"
      - "thesis.tier=edge"

  # ── Monitoring stack (Step 9A) ──

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: thesis-prometheus
    hostname: prometheus.thesis.local
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
      # Client cert for mTLS scrape of node metrics (issued via service-scraper
      # provisioner — see scripts/renew-certs.sh for renewal). Mounted at a
      # separate path because /etc/prometheus is bind-mounted read-only above
      # and cannot have subdirectories created at runtime.
      - ./step-ca/issued/prometheus/prometheus.crt:/etc/thesis-certs/client.crt:ro
      - ./step-ca/issued/prometheus/prometheus.key:/etc/thesis-certs/client.key:ro
      - ./nginx/certs/ca-trust.crt:/etc/thesis-certs/ca-trust.crt:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      thesis-net:
        ipv4_address: 172.28.0.40
        aliases:
          - prometheus.thesis.local
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "thesis.role=metrics-tsdb"
      - "thesis.tier=observability"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: thesis-node-exporter
    hostname: node-exporter.thesis.local
    restart: unless-stopped
    expose:
      - "9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
    networks:
      thesis-net:
        ipv4_address: 172.28.0.41
        aliases:
          - node-exporter.thesis.local
    pid: host
    labels:
      - "thesis.role=host-metrics"
      - "thesis.tier=observability"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: thesis-cadvisor
    hostname: cadvisor.thesis.local
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      thesis-net:
        ipv4_address: 172.28.0.42
        aliases:
          - cadvisor.thesis.local
    labels:
      - "thesis.role=container-metrics"
      - "thesis.tier=observability"

  # ── Logs aggregation (Step 9B) ──

  loki:
    image: grafana/loki:3.3.2
    container_name: thesis-loki
    hostname: loki.thesis.local
    restart: unless-stopped
    expose:
      - "3100"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    networks:
      thesis-net:
        ipv4_address: 172.28.0.50
        aliases:
          - loki.thesis.local
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "thesis.role=log-tsdb"
      - "thesis.tier=observability"

  promtail:
    image: grafana/promtail:3.3.2
    container_name: thesis-promtail
    hostname: promtail.thesis.local
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    networks:
      thesis-net:
        ipv4_address: 172.28.0.51
        aliases:
          - promtail.thesis.local
    depends_on:
      loki:
        condition: service_healthy
    labels:
      - "thesis.role=log-shipper"
      - "thesis.tier=observability"

  # ── Grafana (Step 9C-i) ──

  grafana:
    image: grafana/grafana:11.4.0
    container_name: thesis-grafana
    hostname: grafana.thesis.local
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Behind Nginx subpath /grafana/
      GF_SERVER_ROOT_URL: "https://controller.thesis.local/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

      # Security
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD__FILE: "/run/secrets/grafana_admin_password"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"

      # Disable telemetry/external calls (lab is air-gapped capable)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"

      # Disable signup, anonymous access
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

      # Log to stdout for Promtail capture
      GF_LOG_MODE: "console"
      GF_LOG_LEVEL: "info"
    secrets:
      - grafana_admin_password
    networks:
      thesis-net:
        ipv4_address: 172.28.0.60
        aliases:
          - grafana.thesis.local
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "thesis.role=dashboards"
      - "thesis.tier=observability"

volumes:
  step-ca-data:
    name: thesis-step-ca-data
    external: true   # Already created during init; don't recreate
  controller-data:
    name: thesis-controller-data
  prometheus-data:
    name: thesis-prometheus-data
  loki-data:
    name: thesis-loki-data
  promtail-positions:
    name: thesis-promtail-positions
  grafana-data:
    name: thesis-grafana-data

networks:
  thesis-net:
    name: thesis-lab-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

secrets:
  grafana_admin_password:
    file: ./monitoring/grafana/admin-password.txt
