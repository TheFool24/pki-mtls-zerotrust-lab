# Thesis lab node fleet. The controller (master-lab) is the Ansible control node
# and reaches the Pis directly over VLAN20->VLAN30. Target a single node with
# --limit (e.g. --limit pi-02) so plays never touch a live node unintentionally.
[nodes]
pi-01 ansible_host=10.50.30.11 node_id=pi-01 node_cn=pi-01.thesis.local node_ip=10.50.30.11 node_role=valid
pi-02 ansible_host=10.50.30.12 node_id=pi-02 node_cn=pi-02.thesis.local node_ip=10.50.30.12 node_role=valid

[nodes:vars]
ansible_user=jojo
