# Loki configuration — thesis lab log aggregation
# Single-node mode (filesystem storage, no clustering)

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Retention — extended to 90 days on 2026-06-20 (pre-defense prep).
# Aligned with max_query_length below. Original 30d decision (Decision 5) was
# disk-conservative; actual ingestion footprint is ~2 GB / 30d on this host,
# so 90d ≈ 6 GB — trivial relative to free disk (>400 GB).
limits_config:
  retention_period: 2160h  # 90 days (was 720h / 30 days)
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  max_query_series: 5000
  allow_structured_metadata: true
  volume_enabled: true
  # Loki defaults max_query_length to 30d1h, exactly at the retention boundary.
  # Stat panels using count_over_time({...}[$__range]) with dashboard ranges
  # at or above the retention boundary trip this limit, even when the actual
  # data needed is well within retention. Raised to 90d1h: queries still only
  # return data up to retention_period (720h), but Loki no longer rejects
  # query expressions that nominally span longer. (Added 2026-06-20 after
  # pre-defense dashboard verification.)
  max_query_length: 2161h  # 90d1h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093  # no AM, but required field
