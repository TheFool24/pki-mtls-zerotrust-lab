# Prometheus configuration — thesis lab observability
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: thesis-lab
    environment: lab

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # FastAPI controller — both HTTP metrics + business metrics
  - job_name: thesis-controller
    static_configs:
      - targets: ["controller:8000"]
        labels:
          service: controller
          tier: application
    metrics_path: /metrics

  # Node exporter — host-level metrics (CPU, mem, disk, net)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: master-lab
          tier: infrastructure

  # cAdvisor — per-container resource usage
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          tier: infrastructure
    metrics_path: /metrics

  # Loki — log TSDB. Native /metrics on port 3100; no config flip needed.
  # Added 2026-06-09 to broaden Service Health panel coverage (Гл. 4).
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          tier: observability
    metrics_path: /metrics

  # Promtail — log shipper. Native /metrics on port 9080.
  # Added 2026-06-09 alongside Loki for parity.
  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]
        labels:
          tier: observability
    metrics_path: /metrics

  # NOTE: Grafana would be a third observability scrape target, but its
  # /metrics endpoint is disabled by default (grafana.ini [metrics] enabled
  # is commented; default is off). Enabling requires GF_METRICS_ENABLED=true
  # in compose env + a container recreate. Deferred pending a low-risk window.

  # NOTE: step-ca does NOT expose a Prometheus metrics endpoint. Its /health
  # returns JSON, which Prometheus can't parse as exposition format (the target
  # would show as DOWN). step-ca liveness is observed via its Docker healthcheck
  # and cAdvisor container metrics instead. If dedicated up/down probing is
  # wanted later, add a blackbox-exporter job (proper tool for HTTP health probes).

  # ── Lab node fleet (Step 8C) ──
  # Scraped over mTLS — Prometheus presents a service-scraper-issued leaf;
  # the node agent verifies it against the trust bundle AND checks the CN
  # against THESIS_ALLOWED_SCRAPER_CNS (defense-in-depth: a compromised node
  # cert with a valid chain still cannot scrape neighbor metrics).
  - job_name: thesis-nodes
    scheme: https
    scrape_interval: 30s
    tls_config:
      cert_file: /etc/thesis-certs/client.crt
      key_file: /etc/thesis-certs/client.key
      ca_file: /etc/thesis-certs/ca-trust.crt
      # No job-level server_name: nodes are addressed by IP (outside the Docker
      # bridge's DNS), and each node leaf carries its IP as an IP SAN, so each
      # target is verified against its own cert. This scales to the whole fleet.
    static_configs:
      - targets: ["10.50.30.11:9100"]
        labels:
          node_id: pi-01
          tier: node
          role: valid
          common_name: pi-01.thesis.local
      - targets: ["10.50.30.12:9100"]
        labels:
          node_id: pi-02
          tier: node
          role: valid
          common_name: pi-02.thesis.local
      - targets: ["10.50.30.13:9100"]
        labels:
          node_id: pi-03
          tier: node
          role: valid
          common_name: pi-03.thesis.local
