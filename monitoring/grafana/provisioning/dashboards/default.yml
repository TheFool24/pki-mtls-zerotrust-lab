# Auto-load dashboard JSON files from /var/lib/grafana/dashboards
apiVersion: 1

providers:
  - name: thesis-lab-dashboards
    orgId: 1
    folder: "Thesis Lab"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
