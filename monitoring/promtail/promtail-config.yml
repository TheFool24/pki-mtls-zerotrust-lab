# Promtail configuration — ships Docker container logs to Loki
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["thesis.role"]

    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.+)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_thesis_role"]
        target_label: role
      - source_labels: ["__meta_docker_container_label_thesis_tier"]
        target_label: tier
      - target_label: job
        replacement: docker

    pipeline_stages:
      # ── FastAPI controller (structlog JSON) ──
      - match:
          selector: '{container="thesis-controller"}'
          stages:
            - json:
                expressions:
                  level: level
                  event: event
                  timestamp: timestamp
                  audit_action: action
                  audit_result: result
                  actor_cn: actor_cn
            # actor_cn promoted to a label: the lab's actor set is small and
            # bounded (controller, operator, pi-01..04, pi-test ~= 8 values), and
            # the Audit Trail Explorer dashboard needs it as a label for the
            # identity dropdown + per-actor filtering. (Revised from the earlier
            # 9C-i decision to omit it — over-cautious for lab scale.)
            - labels:
                level:
                event:
                audit_action:
                audit_result:
                actor_cn:
            - timestamp:
                source: timestamp
                format: RFC3339Nano

      # ── Nginx mTLS proxy (JSON access logs) ──
      - match:
          selector: '{container="thesis-nginx"}'
          stages:
            - json:
                expressions:
                  event: event
                  status: status
                  method: method
                  ssl_protocol: ssl_protocol
                  ssl_cipher: ssl_cipher
                  ssl_client_verify: ssl_client_verify
                  upstream_status: upstream_status
                  timestamp: timestamp
            - labels:
                event:
                status:
                method:
                ssl_protocol:
                ssl_client_verify:
            - timestamp:
                source: timestamp
                format: RFC3339
